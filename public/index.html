<title>文件传输助手</title>
<style>
  /* 主题变量：浅色默认；html[data-theme="dark"] 覆盖为深色；JS 在跟随系统/深色/浅色三档间切换。 */
  :root {
    --bg: #F5F7FA; --surface: #fff; --surface-soft: #fafbfc; --text: #222; --muted: #888; --faint: #999;
    --border: #E5E7EB; --border-strong: #E5E7EB; --input-border: #ddd; --input-bg: #fff;
    --btn-bg: #eef0f3; --btn-hover: #e0e4ea; --btn-text: #333; --btn-disabled: #c9ced6;
    --drop-border: #bbb; --accent: #1677ff; --accent-soft: #e8f0fe;
    --ok-bg: #e6f7ee; --ok-text: #00a854; --danger-bg: #fff1f0; --danger-text: #ff4d4f; --danger-hover: #ffccc7;
    --sel-border: #c0c4cc;
    --folder-tint: #F0F7FF; --folder-icon: #3B82F6;
    --bulk-bg: rgba(255,255,255,.96); --bulk-text: #222; --bulk-border: #E5E7EB; --bulk-hover: rgba(0,0,0,.06); --bulk-danger: #ff4d4f;
    --bulk-count-border: rgba(0,0,0,.15); --bulk-count-bg: rgba(0,0,0,.05); --bulk-sep: rgba(0,0,0,.12);
    --bulk-vis-private: #d97706; --bulk-vis-public: #1677ff;
  }
  html[data-theme="dark"] {
    --bg: #0F1115; --surface: #181B20; --surface-soft: #14171c; --text: #e8e8e8; --muted: #9a9a9a; --faint: #888;
    --border: #262A33; --border-strong: #262A33; --input-border: #3a3a3a; --input-bg: #181B20;
    --btn-bg: #2c2c2e; --btn-hover: #3a3a3c; --btn-text: #e8e8e8; --btn-disabled: #3a3a3c;
    --drop-border: #3a3a3c; --accent-soft: #1c2b3a;
    --ok-bg: #122b1d; --ok-text: #3fce7c; --danger-bg: #3a1d1d; --danger-text: #ff7875; --danger-hover: #4a2222;
    --sel-border: #555;
    --folder-tint: rgba(59,130,246,.12); --folder-icon: #60a5fa;
    --bulk-bg: rgba(28,28,30,.94); --bulk-text: #fff; --bulk-border: transparent; --bulk-hover: rgba(255,255,255,.16); --bulk-danger: #ff7875;
    --bulk-count-border: rgba(255,255,255,.35); --bulk-count-bg: rgba(255,255,255,.12); --bulk-sep: rgba(255,255,255,.25);
    --bulk-vis-private: #fbbf24; --bulk-vis-public: #69b1ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 96px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  h1 svg { width: 20px; height: 20px; vertical-align: -3px; }
  /* 内联 SVG 图标（分段选择、按钮、筛选菜单、面包屑里的图标）跟文字对齐。 */
  .seg-opt svg, #uploadBtn svg, #expireBtn svg, #themeBtn svg, #filterMenu svg, #folderBtn svg, .crumbs svg, .move-opt svg, .user-chip svg { width: 1em; height: 1em; vertical-align: -0.12em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .drop { border: 2px dashed var(--drop-border); border-radius: 10px; padding: 26px 12px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  /* 上传区可折叠：标题行 + 折叠按钮，收起时只留一行，手机首屏直接看到文件列表。 */
  .upload-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .upload-head .upload-title { font-size: 15px; font-weight: 600; }
  .upload-head .icon-btn { width: 30px; height: 30px; }
  .upload-head .icon-btn svg { transition: transform .2s; }
  #uploadCard.collapsed .upload-body { display: none; }
  #uploadCard.collapsed .upload-head { margin-bottom: 0; }
  #uploadCard.collapsed .upload-head .icon-btn svg { transform: rotate(-90deg); }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  /* 分段选择（上传表单的私密/公开、R2/本地）：一行两个选项，只留图标+文字，选中项蓝底白字。 */
  .seg { display: flex; border: 1px solid var(--input-border); border-radius: 10px; overflow: hidden; width: fit-content; max-width: 100%; margin-top: 12px; }
  .seg-opt { flex: 1; margin: 0; }
  .seg-opt input { display: none; }
  .seg-opt span { display: block; padding: 9px 18px; font-size: 13px; cursor: pointer; color: var(--muted); text-align: center; white-space: nowrap; background: var(--surface); }
  .seg-opt input:checked + span { background: var(--accent); color: #fff; font-weight: 600; }
  /* 上传区两行布局（v2.6）：第一行两个分段 1:1 并排，第二行有效期 + 上传按钮。 */
  .seg-row { display: flex; gap: 8px; margin-top: 12px; }
  .seg-row .seg { flex: 1 1 0; min-width: 0; margin-top: 0; width: auto; }
  .up-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .up-row #uploadBtn { flex: 1 1 auto; min-width: 0; }
  .up-row #uploadBtn:disabled { opacity: .45; }
  /* 筛选胶囊横向滑动：5 个类型胶囊一行滑动不换行，操作按钮另起一行。 */
  /* 工具栏两行：第一行搜索框 + 图标按钮（新建/视图/全选），第二行类型标签横向滚动 + 筛选/排序。 */
  .toolbar-row { display: flex; gap: 8px; align-items: center; }
  .toolbar-row .search { flex: 1; min-width: 0; width: auto; margin: 0; }
  .toolbar-row .icon-btn { flex-shrink: 0; }
  .toolbar-row .icon-btn.active { background: var(--accent); color: #fff; }
  .filter-row { display: flex; gap: 8px; align-items: center; }
  .filter-row .filter-scroll { flex: 1; min-width: 0; }
  .filter-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-scroll .pill { flex-shrink: 0; white-space: nowrap; }
  /* 可见性切换按钮上色：私密琥珀黄锁，公开蓝色地球（批量栏用）。 */
  .icon-btn.vis-private { color: #e8a13a; }
  .icon-btn.vis-public { color: #2f7de1; }
  .bulk-btn.vis-private { color: var(--bulk-vis-private); }
  .bulk-btn.vis-public { color: var(--bulk-vis-public); }
  /* 防竖排：横向按钮里的字和图标永远横排，不折行。 */
  .pill, .bulk-btn, .crumbs button { white-space: nowrap; }
  @media (max-width: 375px) {
    .seg-opt span { padding: 6px 4px; font-size: 13px; }
  }
  input[type=password], input[type=text] { flex: 1; min-width: 160px; padding: 9px 12px; border: 1px solid var(--input-border); border-radius: 8px; font-size: 14px; background: var(--input-bg); color: var(--text); }
  button { padding: 9px 18px; border: 0; border-radius: 8px; background: #1677ff; color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { background: var(--btn-disabled); opacity: .55; cursor: not-allowed; }
  button.ghost { background: var(--btn-bg); color: var(--btn-text); }
  button.danger { background: #ff4d4f; }
  .progress { height: 8px; background: var(--border); border-radius: 4px; margin-top: 12px; overflow: hidden; display: none; }
  .progress > div { height: 100%; background: #1677ff; width: 0%; }
  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .msg.err { color: #ff4d4f; } .msg.ok { color: var(--ok-text); }
  .stats { font-size: 13px; color: var(--muted); }
  /* 存储配额进度条：两条纤细的双色进度条，一眼看出两个存储池的余量。 */
  .quota { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .quota-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .quota-row .q-label { flex-shrink: 0; width: 32px; }
  .quota-row .q-bar { flex: 1; min-width: 0; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .quota-row .q-bar > div { height: 100%; border-radius: 3px; }
  .quota-row .q-bar.r2 > div { background: #1677ff; }
  .quota-row .q-bar.local > div { background: #22c55e; }
  .quota-row .q-text { flex-shrink: 0; white-space: nowrap; }
  .file { display: flex; align-items: flex-start; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--border-strong); position: relative; }
  .file:last-child { border-bottom: 0; }
  .icon { font-size: 26px; width: 36px; text-align: center; }
  .icon svg { width: 26px; height: 26px; vertical-align: middle; color: var(--muted); }
  /* 分享文件夹页的标题行文件夹图标：没包在 .icon 里时也要定死尺寸，不然 SVG 默认尺寸会撑满一屏。 */

// 批量打包下载成一个 ZIP（按 ImgBed AdminDashBoard handleBatchDownload）：
// 逐个 fetch 成 blob，同名文件加 (n) 后缀去重，JSZip 打包后一次下载。
// 单个文件不打包，直接下载原文件。R2 文件走 /f/ 直链（302 到预签名 GET，
// 桶 CORS 已允许本站 origin 的 GET，所以浏览器 fetch 能拿到）。
async function bulkDownload() {
  const files = [...selected].map(id => allFiles.find(f => f.id === id)).filter(Boolean);
  if (!files.length) return;
  if (files.length === 1) {
    const a = document.createElement('a');
    a.href = '/f/' + files[0].id + '?download=1';
    a.download = files[0].name;
    document.body.appendChild(a); a.click(); a.remove();
    setMsg('已开始下载 1 个文件', 'ok');
    return;
  }
  if (typeof JSZip === 'undefined') { setMsg('打包组件未加载，请刷新页面重试', 'err'); return; }
  setMsg('正在打包 ' + files.length + ' 个文件…', '');
  const zip = new JSZip();
  const folder = zip.folder('files');
  const nameCount = {};
  const jobs = files.map(async (f) => {
    const r = await fetch('/f/' + f.id + '?download=1');
    if (!r.ok) throw new Error(f.name + ' 下载失败（HTTP ' + r.status + '）');
    const blob = await r.blob();
    let name = f.name;
    if (nameCount[name]) {
      const dot = name.lastIndexOf('.');
      const base = dot === -1 ? name : name.slice(0, dot);
      const ext = dot === -1 ? '' : name.slice(dot);
      name = base + '(' + nameCount[name] + ')' + ext;
      nameCount[f.name]++;
    } else {
      nameCount[name] = 1;
    }
    folder.file(name, blob);
  });
  try {
    await Promise.all(jobs);
  } catch (e) {
    setMsg('打包失败：' + (e && e.message ? e.message : '网络错误'), 'err');
    return;
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'files.zip';
  document.body.appendChild(a); a.click(); a.remove();
  setMsg('已打包下载 ' + files.length + ' 个文件', 'ok');
}

  if (searchResults !== null) { $('search').value = ''; searchResults = null; }
  currentFolderId = id || null;
  clearSelection();
  loadList();
}
// 通用输入弹窗（代替浏览器 prompt()：手机上原生弹窗经常不弹或被拦截，
// 而且样式很生硬）。返回输入的字符串，点取消/×/蒙层返回 null。
let inputResolve = null;
function askInput(title, defVal, type) {
  return new Promise((res) => {
    inputResolve = res;
    $('inputTitle').textContent = title;
    const f = $('inputField');
    f.type = type || 'text';
    f.value = defVal || '';
    $('inputModal').classList.add('open');
    setTimeout(() => { try { f.focus(); } catch {} }, 60);
  });
}
function closeInputModal(val) {
  $('inputModal').classList.remove('open');
  if (inputResolve) { const r = inputResolve; inputResolve = null; r(val); }
}
$('inputOk').onclick = () => closeInputModal($('inputField').value);
$('inputCancel').onclick = () => closeInputModal(null);
$('inputClose').onclick = () => closeInputModal(null);
$('inputModal').onclick = (e) => { if (e.target.id === 'inputModal') closeInputModal(null); };
$('inputField').addEventListener('keydown', (e) => { if (e.key === 'Enter') closeInputModal($('inputField').value); });
// 站点公告：读出来展示在顶栏下方；访客点了 × 就不再显示，直到公告换了新内容才再出现。
let currentAnnouncement = '';
async function loadAnnouncement() {
  try {
    const d = await (await fetch('/api/announcement')).json();
    currentAnnouncement = (d.announcement || '').trim();
    const dismissed = localStorage.getItem('fs-announce-dismissed') || '';
    if (currentAnnouncement && dismissed !== currentAnnouncement) {
      $('announceText').textContent = currentAnnouncement;
      $('announceBar').style.display = 'flex';
    } else {
      $('announceBar').style.display = 'none';
    }
  } catch { $('announceBar').style.display = 'none'; }
}
$('announceClose').onclick = () => {
  try { localStorage.setItem('fs-announce-dismissed', currentAnnouncement); } catch {}
  $('announceBar').style.display = 'none';
};
async function editAnnouncement() {
  const next = await askInput('设置公告（留空 = 不显示）：', currentAnnouncement);
  if (next === null) return;
  const text = next.trim().slice(0, 200);
  const r = await fetch('/api/announcement', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ announcement: text }) });
  const d = await r.json();
  if (!d.ok) { setMsg('保存公告失败：' + (d.error || ''), 'err'); return; }
  currentAnnouncement = d.announcement || '';
  try { localStorage.removeItem('fs-announce-dismissed'); } catch {}
  loadAnnouncement();
  setMsg(currentAnnouncement ? '公告已更新' : '公告已清除', 'ok');
}
$('announceBtn').onclick = editAnnouncement;
async function createFolder() {
  const name = await askInput('新文件夹名字：');
  if (name === null) return;
  if (!name.trim()) { setMsg('名字不能为空', 'err'); return; }
  const r = await fetch('/api/folders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name.trim(), parentId: currentFolderId }) });
  const d = await r.json();
  if (d.ok) loadList(); else setMsg('新建失败：' + (d.error || ''), 'err');
}
async function renameFolder(id, name) {
  const next = await askInput('文件夹改名：', name);
  if (next === null) return;
  if (!next.trim()) { setMsg('名字不能为空', 'err'); return; }
  const r = await fetch('/api/folders/' + id + '/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: next.trim() }) });
  const d = await r.json();
  if (d.ok) loadList(); else setMsg('改名失败：' + (d.error || ''), 'err');
}
async function deleteFolder(id, name) {
  if (!confirm(`确定删除文件夹「${name}」吗？只有空文件夹能删。`)) return;
  const r = await fetch('/api/folders/' + id, { method: 'DELETE' });
  const d = await r.json();
  if (d.ok) loadList(); else setMsg('删除失败：' + (d.error || ''), 'err');
}
// 文件改名（管理员）：改名后分享链接和下载地址不变（都按 id 找）。
async function renameFile(id, name) {
  const next = await askInput('文件改名：', name);
  if (next === null) return;
  if (!next.trim()) { setMsg('名字不能为空', 'err'); return; }
  const r = await fetch('/api/files/' + id + '/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: next.trim() }) });
  const d = await r.json();
  if (d.ok) loadList(); else setMsg('改名失败：' + (d.error || ''), 'err');
}
// 移动：单文件或批量，弹框选目标文件夹（根目录或任一文件夹）；文件夹也能整个移动，
// 目标列表里会去掉它自己和它的子孙文件夹（移进去会成死循环）。
let moveIds = [];
let moveKind = 'file';
function openMoveModal(ids, kind, label) {
  moveIds = [...ids];
  moveKind = kind || 'file';
  $('moveTitle').textContent = moveKind === 'folder' ? `移动文件夹「${label || ''}」到…` : `移动 ${moveIds.length} 个文件到…`;
  $('moveList').innerHTML = '<div class="empty">加载中…</div>';
  $('moveModal').classList.add('open');
  fetch('/api/folders').then(r => r.json()).then(d => {
    const all = d.folders || [];
    const pathOf = (fd) => {
      const names = [fd.name];
      let cur = fd;
      const seen = new Set([fd.id]);
      while (cur.parentId) {
        const p = all.find(x => x.id === cur.parentId);
        if (!p || seen.has(p.id)) break;
        seen.add(p.id);
        names.unshift(p.name);
        cur = p;
      }
      return names.join(' / ');
    };
    // 移文件夹时排除自己和所有子孙。
    const blocked = new Set();
    if (moveKind === 'folder') {
      const stack = [...moveIds];
      while (stack.length) {
        const cur = stack.pop();
        blocked.add(cur);
        all.filter(x => x.parentId === cur).forEach(x => stack.push(x.id));
      }
    }
    const opts = [{ id: null, label: '根目录', icon: '' }].concat(all.filter(fd => !blocked.has(fd.id)).map(fd => ({ id: fd.id, label: pathOf(fd), icon: ICONS.folder })));
    $('moveList').innerHTML = opts.map(o => `<button class="move-opt" onclick="moveFilesTo(${o.id ? `'${o.id}'` : 'null'})">${o.icon ? o.icon + ' ' : ''}${escapeHtml(o.label)}</button>`).join('');
  }).catch(() => { $('moveList').innerHTML = '<div class="empty">加载失败</div>'; });
}
async function moveFilesTo(folderId) {
  if (moveKind === 'folder') {
    for (const id of moveIds) {
      const r = await fetch('/api/folders/' + id + '/move', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ parentId: folderId }) });
      const d = await r.json();
      if (!d.ok) setMsg('移动失败：' + (d.error || ''), 'err');
    }
  } else {
    for (const id of moveIds) {
      await fetch('/api/files/' + id + '/move', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folderId }) });
    }
    clearSelection();
  }
  $('moveModal').classList.remove('open');
  loadList();
}
$('moveClose').onclick = () => $('moveModal').classList.remove('open');
$('moveModal').onclick = (e) => { if (e.target.id === 'moveModal') $('moveModal').classList.remove('open'); };
$('newFolderBtn').onclick = () => createFolder();

// 管理员登录：登录后上传/删除不用再输密码，7 天内有效。
async function refreshAuth() {
  try {
    const r = await fetch('/api/me');
    const d = await r.json();
    authed = !!d.authed;
  } catch { authed = false; }
  renderLoginbar();
  $('passwordRow').style.display = authed ? 'none' : '';
}
function renderLoginbar() {
  const bar = $('loginbar');
  if (authed) {
    bar.innerHTML = `<span class="user-chip">${ICONS.user} admin <button class="chip-exit" id="logoutBtn" title="退出" aria-label="退出">${ICONS.logout}</button></span>`;
    $('logoutBtn').onclick = async () => {
      await fetch('/api/logout', { method: 'POST' });
      authed = false;
      renderLoginbar();
      $('passwordRow').style.display = '';
      setMsg('已退出登录', '');
      loadList();
    };
  } else {
    bar.innerHTML = `<button id="showLoginBtn">管理员登录</button>`;
    $('showLoginBtn').onclick = () => {
      $('loginCard').classList.add('open');
      $('loginPass').focus();
    };
  }
}
$('loginCancel').onclick = () => {
  $('loginCard').classList.remove('open');
  $('loginMsg').textContent = '';
};
$('loginBtn').onclick = async () => {
  const username = $('loginUser').value.trim() || 'admin';
  const password = $('loginPass').value;
  const lm = $('loginMsg');
  if (!password) { lm.textContent = '请先填密码'; lm.className = 'msg err'; return; }
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const d = await r.json();
    if (r.ok && d.ok) {
      authed = true;
      $('loginCard').classList.remove('open');
      $('loginPass').value = '';
      lm.textContent = '';
      renderLoginbar();
      $('passwordRow').style.display = 'none';
      setMsg('已登录，上传不用再输密码', 'ok');
      loadList();
    } else {
      lm.textContent = '登录失败：' + (d.error || ('HTTP ' + r.status));
      lm.className = 'msg err';
    }
  } catch {
    lm.textContent = '登录失败：网络错误';
    lm.className = 'msg err';
  }
};
$('loginPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}
function fmtDate(s) { return new Date(s).toLocaleString('zh-CN', { hour12: false }); }
function iconFor(f) {
  if (f.kind === 'video') return ICONS.film;
  if (f.kind === 'image') return ICONS.image;
  if (f.kind === 'audio') return ICONS.music;
  if (/\.(apk|exe|dmg|iso)$/i.test(f.name)) return ICONS.package;
  if (/\.(zip|rar|7z|tar|gz)$/i.test(f.name)) return ICONS.archive;
  return ICONS.file;
}
// 权限徽章（和存储徽章并排在卡片左上角 / 列表 meta 里）：管理员点一下直接切换公开/私密，访客只看。
function visBadge(f) {
  const label = f.visibility === 'private' ? '私密' : '公开';
  const next = f.visibility === 'private' ? 'public' : 'private';
  if (authed) return `<button class="badge vis-${f.visibility}" title="点一下切换为${next === 'private' ? '私密' : '公开'}" onclick="event.stopPropagation(); setVisibility('${f.id}', '${next}')">${label}</button>`;
  return `<span class="badge vis-${f.visibility}">${label}</span>`;
}
function setMsg(text, cls) { const m = $('msg'); m.textContent = text; m.className = 'msg ' + (cls || ''); }

async function loadList() {
  try {
    const r = await fetch('/api/files' + (currentFolderId ? '?folderId=' + encodeURIComponent(currentFolderId) : ''));
    const d = await r.json();
    allFiles = d.files || [];
    currentFolders = d.folders || [];
    currentPath = d.path || [{ id: null, name: '根目录' }];
    currentFolderId = (currentPath.length > 1) ? currentPath[currentPath.length - 1].id : null;
    r2On = d.r2 === true;
    updateR2Hint();
    $('newFolderBtn').style.display = authed ? '' : 'none';
    $('folderBtn').style.display = authed ? '' : 'none';
    $('selectAllBtn').style.display = authed ? '' : 'none';
    $('announceBtn').style.display = authed ? '' : 'none';
    // 统计行：文件数 + 两条纤细的双色配额进度条（R2 蓝、本地绿），一眼看出两个存储池的余量。
    const r2Pct = r2On && d.r2Total ? Math.min(100, (d.r2Used || 0) / d.r2Total * 100) : 0;
    const localPct = d.diskTotal ? Math.min(100, (d.localUsed || 0) / d.diskTotal * 100) : 0;
    // 配额条只给管理员看：访客只看到“共 N 个文件”。
    let quotaHtml = `<div>共 ${allFiles.length} 个文件</div>`;
    if (authed) {
      quotaHtml += `<div class="quota">`;
      if (r2On) quotaHtml += `<div class="quota-row"><span class="q-label">R2</span><div class="q-bar r2"><div style="width:${r2Pct.toFixed(1)}%"></div></div><span class="q-text">${fmtSize(d.r2Used || 0)} / ${fmtSize(d.r2Total || 0)}</span></div>`;
      quotaHtml += `<div class="quota-row"><span class="q-label">本地</span><div class="q-bar local"><div style="width:${localPct.toFixed(1)}%"></div></div><span class="q-text">${fmtSize(d.localUsed || 0)} / ${fmtSize(d.diskTotal || 0)}</span></div></div>`;
    }
    $('stats').innerHTML = quotaHtml;
    renderList();
  } catch (e) {
    $('stats').textContent = '列表加载失败';
  }
}
function expiryText(expiresAt) {
  if (!expiresAt) return '';
  const diff = new Date(expiresAt).getTime() - Date.now();
  if (diff <= 0) return '已过期';
  if (diff < 3600 * 1000) return Math.ceil(diff / 60000) + '分钟后过期';
  if (diff < 86400 * 1000) return Math.floor(diff / 3600000) + '小时后过期';
  return Math.floor(diff / 86400000) + '天后过期';
}
// 到期倒计时的完整 HTML：24 小时内到期时包一层 .expiring-soon（琥珀色提醒），其余照常。
function expiryHtml(expiresAt) {
  if (!expiresAt) return '';
  const diff = new Date(expiresAt).getTime() - Date.now();
  if (diff <= 0) return ' · ⏰ 已过期';
  const txt = expiryText(expiresAt);
  return diff <= 86400 * 1000
    ? ' · <span class="expiring-soon">⏰ ' + txt + '</span>'
    : ' · ⏰ ' + txt;
}
function renderList() {
  if (!authed) selected.clear();
  const q = $('search').value.trim().toLowerCase();
  const searching = searchResults !== null;
  const typeOk = (f) => {
    if (typeFilter === 'pkg') return /\.(apk|exe|dmg|iso)$/i.test(f.name);
    if (typeFilter === 'video') return f.kind === 'video';
    if (typeFilter === 'image') return f.kind === 'image';
    if (typeFilter === 'archive') return /\.(zip|rar|7z|tar|gz)$/i.test(f.name);
    return true;
  };
  // 存储默认本地、可见性默认公开（和服务端 loadMeta 的补默认值一致）。
  const storeOk = (f) => (f.storage === 'r2' ? storeFilter.r2 : storeFilter.local);
  const visOk = (f) => (f.visibility === 'private' ? visFilter.private : visFilter.public);
  // 搜索模式：文件和文件夹都来自服务端全局搜索结果（已按名字筛过），只再按类型胶囊过滤。
  const list = (searching ? searchResults.files : allFiles.filter(f => !q || f.name.toLowerCase().includes(q))).filter(typeOk).filter(storeOk).filter(visOk).sort(sortFiles);
  viewFiles = list;
  // 全选本页按钮（图标）：本页已全选就高亮并改提示为“取消全选”。
  const sab = $('selectAllBtn');
  if (sab) {
    const all = viewFiles.length && viewFiles.every(f => selected.has(f.id));
    sab.classList.toggle('active', !!all);
    sab.title = all ? '取消全选' : '全选本页';
    sab.setAttribute('aria-label', sab.title);
  }
  const folders = (searching ? searchResults.folders : currentFolders.filter(fd => !q || fd.name.toLowerCase().includes(q))).sort(sortFolders);
  for (const id of [...selected]) if (!list.some(f => f.id === id)) selected.delete(id);
  if (searching) {
    // 搜索模式面包屑：显示搜了什么和结果数，点清除回当前目录。
    $('crumbs').innerHTML = `<span class="cur">${ICONS.search} 搜索“${escapeHtml(q)}”</span><span class="sep">·</span><button onclick="clearSearch()">清除</button><span class="meta">共 ${list.length + folders.length} 个结果</span>`;
  } else {
    // 面包屑：根目录 / 文件夹 / 子文件夹，点任意一级返回；每级后面的 ▾ 点开看同级文件夹，直接跳转。
    $('crumbs').innerHTML = currentPath.map((p, i) => {
      const last = i === currentPath.length - 1;
      const nameHtml = last
        ? `<span class="cur">${escapeHtml(p.name)}</span>`
        : `<button onclick="openFolder(${p.id ? `'${p.id}'` : 'null'})">${escapeHtml(p.name)}</button>`;
      return (i ? '<span class="sep">/</span>' : '') + `<span class="crumb-wrap">${nameHtml}<button class="crumb-drop" title="同级文件夹" aria-label="同级文件夹" onclick="toggleCrumbDrop(event, ${i})">▾</button><span class="crumb-menu" id="crumbMenu-${i}" style="display:none"></span></span>`;
    }).join('');
  }
  const el = $('list');
  if (!folders.length && !list.length) { el.innerHTML = `<div class="empty">${searching ? '没有找到相关文件' : '这个文件夹是空的，先上传一个吧'}</div>`; updateBulkbar(); return; }
  if (viewMode === 'grid') {
    // 网格视图（上图下文）：文件夹和文件都是一张卡片，上方缩略图/扁平图标，下方纯色信息区；图片显示真缩略图，视频显示首帧，其他文件显示大图标。
    el.innerHTML = '<div class="grid">' + folders.map(fd => `
    <div class="card folder-card" onclick="folderClick(event, '${fd.id}')" ontouchstart="cardTouchStart(event, '${fd.id}', 'folder')" ontouchend="cardTouchEnd()" ontouchmove="cardTouchEnd()" oncontextmenu="event.preventDefault()">
      <div class="thumb"><span class="bigicon">${ICONS.folderSolid}</span></div>
      <div class="cinfo">
        <div class="cname">${escapeHtml(fd.name)}</div>
        <div class="cmeta">${folderMeta(fd)}${searching && fd.path ? ' · 在 ' + escapeHtml(fd.path) : ''}</div>
        ${authed ? `<div class="cactions">
          <button class="icon-btn" title="复制文件夹分享链接" aria-label="复制文件夹分享链接" onclick="event.stopPropagation(); copyFolderLink('${fd.id}', this)">${ICONS.link}</button>
          <button class="icon-btn" title="移动文件夹" aria-label="移动文件夹" onclick="event.stopPropagation(); openMoveModal(['${fd.id}'], 'folder', '${escapeHtml(fd.name)}')">${ICONS.move}</button>
          <button class="icon-btn" title="重命名" aria-label="重命名" onclick="event.stopPropagation(); renameFolder('${fd.id}', '${escapeHtml(fd.name)}')">${ICONS.pencil}</button>
          <button class="icon-btn" title="更多操作" aria-label="更多操作" onclick="event.stopPropagation(); openSheet('${fd.id}', 'folder')">${ICONS.more}</button>
        </div>` : ''}
      </div>
    </div>`).join('') + list.map(f => `
    <div class="card" ontouchstart="cardTouchStart(event, '${f.id}', 'file')" ontouchend="cardTouchEnd()" ontouchmove="cardTouchEnd()" oncontextmenu="event.preventDefault()">
      <div class="thumb" onclick="thumbClick(event, '${f.id}')">
        ${authed ? `<input type="checkbox" class="sel" title="选择" aria-label="选择" onclick="event.stopPropagation()" onchange="toggleSelect('${f.id}', this.checked)" ${selected.has(f.id) ? 'checked' : ''}>` : ''}
        <span class="ctag">${f.storage === 'r2' ? '<span class="badge r2">R2</span>' : '<span class="badge local">本地</span>'}${visBadge(f)}</span>
        ${f.kind === 'image' ? `<img src="/thumb/${f.id}" loading="lazy" alt="" onerror="this.onerror=null;this.src='/f/${f.id}'">` : f.kind === 'video' ? `<video src="/f/${f.id}" preload="metadata" muted onmouseenter="this.play().catch(()=>{})" onmouseleave="this.pause();this.currentTime=0"></video>` : `<span class="bigicon">${iconFor(f)}</span>`}
      </div>
      <div class="cinfo">
        <div class="cname">${escapeHtml(f.name)}</div>
        <div class="cmeta">${fmtSize(f.size)}${f.downloads ? ' · 下载 ' + f.downloads + ' 次' : ''}${searching && f.folderPath ? ' · 在 ' + escapeHtml(f.folderPath) : ''}</div>
        <div class="cactions">
          <button class="icon-btn" title="复制链接" aria-label="复制链接" onclick="copyLink('${f.id}', this)">${ICONS.link}</button>
          ${(f.kind === 'video' || f.kind === 'image') ? `<button class="icon-btn" title="预览" aria-label="预览" onclick="preview('${f.id}')">${ICONS.eye}</button>` : ''}
          <button class="icon-btn" title="更多操作" aria-label="更多操作" onclick="openSheet('${f.id}', 'file')">${ICONS.more}</button>
        </div>
      </div>
    </div>`).join('') + '</div>';
    updateBulkbar();
    return;
  }
  el.innerHTML = folders.map(fd => `
    <div class="file folder" onclick="folderClick(event, '${fd.id}')" ontouchstart="cardTouchStart(event, '${fd.id}', 'folder')" ontouchend="cardTouchEnd()" ontouchmove="cardTouchEnd()" oncontextmenu="event.preventDefault()">
      <div class="icon">${ICONS.folderSolid}</div>
      <div class="info">
        <div class="name">${escapeHtml(fd.name)}</div>
        <div class="meta">${folderMeta(fd)}${searching && fd.path ? ' · 在 ' + escapeHtml(fd.path) : ''}</div>
      </div>
      ${authed ? `<div class="actions">
        <button class="icon-btn" title="复制文件夹分享链接" aria-label="复制文件夹分享链接" onclick="event.stopPropagation(); copyFolderLink('${fd.id}', this)">${ICONS.link}</button>
        <button class="icon-btn" title="移动文件夹" aria-label="移动文件夹" onclick="event.stopPropagation(); openMoveModal(['${fd.id}'], 'folder', '${escapeHtml(fd.name)}')">${ICONS.move}</button>
        <button class="icon-btn" title="重命名" aria-label="重命名" onclick="event.stopPropagation(); renameFolder('${fd.id}', '${escapeHtml(fd.name)}')">${ICONS.pencil}</button>

async function enqueueFolderFiles(files) {
  if (!authed) { setMsg('上传文件夹需要先登录', 'err'); return; }
  const visibility = document.querySelector('input[name=vis]:checked').value;
  const expires = expireHours;
  const r = await fetch('/api/folders');
  const d = await r.json();
  const all = d.folders || [];
  const cache = new Map(); // 相对目录路径 -> folderId
  const resolveDir = async (relDir) => {
    if (!relDir) return currentFolderId; // 根目录：folderId 就是 null（合法值，不是失败）
    if (cache.has(relDir)) return cache.get(relDir);
    const segs = relDir.split('/').filter(Boolean);
    let parentId = currentFolderId;
    let path = '';
    for (const seg of segs) {
      path = path ? path + '/' + seg : seg;
      if (cache.has(path)) { parentId = cache.get(path); continue; }
      let child = all.find(x => (x.parentId || null) === (parentId || null) && x.name === seg);
      if (!child) {
        const cr = await fetch('/api/folders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: seg, parentId }) });
        const cd = await cr.json();
        if (!cd.ok) {
          // 别人刚好建了同名文件夹：重拉一遍列表再找一次，还找不到才报错。
          const rr = await fetch('/api/folders');
          const rd = await rr.json();
          const retry = (rd.folders || []).find(x => (x.parentId || null) === (parentId || null) && x.name === seg);
          if (retry) { child = retry; all.push(child); }
          else { setMsg('创建文件夹失败：' + (cd.error || ''), 'err'); return false; }
        } else {
          child = cd.folder;
          all.push(child);
        }
      }
      cache.set(path, child.id);
      parentId = child.id;
    }
    return parentId;
  };
  for (const f of files) {
    const folderId = await resolveDir(relDirOf(f.webkitRelativePath || f.name));
    if (folderId === false) return; // 创建失败，已提示，整批停下
    uploadQueue.push({ file: f, visibility, expires, folderId });
  }

async function maybeUploadThumb(fileObj, file) {
  if (!fileObj || fileObj.kind !== 'image') return;
  try {
    let bmp = null;
    try { bmp = await createImageBitmap(file); } catch {
      const url = URL.createObjectURL(file);

        bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
      } finally { URL.revokeObjectURL(url); }
    }

    const max = 320;

    const w = Math.max(1, Math.round(bmp.width * scale));
    const h = Math.max(1, Math.round(bmp.height * scale));

    c.width = w; c.height = h;
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();

    if (!blob) return;
    const pw = authed ? '' : $('password').value.trim();

// 分片上传（大文件断点续传）：文件大于 32MB 时自动走分片。
// 切成 5MB 一片逐片传到 VPS，单片失败只重传那一片；刷新页面后凭 localStorage 里的
// uploadId 问服务器哪些片已收到，只传缺的片。传完通知服务器拼起来：本地直接落盘，
// R2 则由 VPS 一次性传到 R2（机房网络快且稳，小文件仍走原来的单次直传，不经过 VPS）。
const CHUNK_UPLOAD_THRESHOLD = 32 * 1024 * 1024; // 大于 32MB 走分片
const CHUNK_SIZE = 5 * 1024 * 1024; // 一片 5MB（和服务端一致）
const CHUNK_RETRIES = 3; // 单片最多重试 3 次
async function uploadChunked(job, idx, total, targetFolderId, pw) {
  const f = job.file;
  const totalChunks = Math.ceil(f.size / CHUNK_SIZE);
  const resumeKey = 'fs-chunk-' + [f.name, f.size, f.lastModified].join('|');
  const headers = pw ? { 'X-Upload-Password': pw } : {};
  const startedAt = Date.now();
  let lastShown = 0;
  const showChunkProgress = (loaded, chunkIdx) => {
    const pct = Math.round(loaded / f.size * 100);
    $('bar').style.width = pct + '%';
    const el = (Date.now() - startedAt) / 1000;
    const speed = el > 0 ? loaded / el : 0;
    const eta = speed > 0 ? Math.max(0, Math.round((f.size - loaded) / speed)) : 0;
    const now = Date.now();
    if (now - lastShown > 500 || loaded === f.size) {
      lastShown = now;
      setMsg(`正在上传 ${idx}/${total}：${f.name} · ${pct}% · 分片 ${Math.min(totalChunks, chunkIdx + 1)}/${totalChunks} · ${fmtSize(speed)}/s · 还剩约 ${eta} 秒`, '');
    }
  };
  // 断点续传：先问服务器这批 uploadId 已收到哪些片。
  const fetchReceived = async (uploadId) => {
    try {
      const r = await fetch('/api/upload/chunk-status?uploadId=' + encodeURIComponent(uploadId), { headers });
      const d = await r.json();
      if (d.ok && Array.isArray(d.received)) return new Set(d.received);
    } catch {}
    return new Set();
  };
  for (let round = 0; round < 2; round++) {
    let uploadId = localStorage.getItem(resumeKey) || '';
    if (!uploadId || round === 1) {
      uploadId = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      localStorage.setItem(resumeKey, uploadId);
    }
    const received = await fetchReceived(uploadId);
    let mismatch = false;
    let failed = null;
    for (let i = 0; i < totalChunks; i++) {
      if (received.has(i)) { showChunkProgress(Math.min(f.size, (i + 1) * CHUNK_SIZE), i); continue; }
      const start = i * CHUNK_SIZE;
      const end = Math.min(f.size, start + CHUNK_SIZE);
      const blob = f.slice(start, end);
      let ok = false;
      let lastErr = '';
      for (let attempt = 1; attempt <= CHUNK_RETRIES; attempt++) {
        try {
          const qs = new URLSearchParams({
            uploadId, index: String(i), total: String(totalChunks),
            name: f.name, size: String(f.size),
            visibility: job.visibility, expires: String(job.expires),
            storage: uploadToR2() ? 'r2' : 'local',
            folderId: targetFolderId || '',
          });
          const r = await fetch('/api/upload/chunk?' + qs.toString(), {
            method: 'POST', headers: { ...headers, 'Content-Type': 'application/octet-stream' }, body: blob,
          });
          const d = await r.json().catch(() => ({}));
          if (r.ok && d.ok) { ok = true; break; }
          lastErr = (d && d.error) || ('HTTP ' + r.status);
          if (lastErr.indexOf('不一致') !== -1) { mismatch = true; break; }
        } catch (e) {
          lastErr = (e && e.message) || '网络错误';
        }
        if (attempt < CHUNK_RETRIES) {
          setMsg(`第 ${i + 1}/${totalChunks} 片重试 ${attempt}/${CHUNK_RETRIES}…`, '');
          await new Promise(res => setTimeout(res, 1000 * attempt));
        }
      }
      if (mismatch) break;
      if (!ok) { failed = `第 ${i + 1} 片传了 ${CHUNK_RETRIES} 次都不成功（${lastErr}）`; break; }
      received.add(i);
      showChunkProgress(Math.min(f.size, (i + 1) * CHUNK_SIZE), i);
    }
    if (mismatch) {
      localStorage.removeItem(resumeKey);
      if (round === 0) continue; // 换个新 uploadId 从头再来一轮
      setMsg(`第 ${idx} 个上传失败：分片信息不一致`, 'err');
      return;
    }
    if (failed) {
      setMsg(`第 ${idx} 个上传失败：${failed}，已保留已传的分片，刷新页面后可断点续传`, 'err');
      return;
    }
    setMsg(`正在合并 ${idx}/${total}：${f.name}…`, '');
    try {
      const r = await fetch('/api/upload/chunk-complete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uploadId, password: pw || undefined }),
      });
      const d = await r.json();
      if (!d.ok) { setMsg(`第 ${idx} 个合并失败：` + (d.error || ('HTTP ' + r.status)), 'err'); return; }
      localStorage.removeItem(resumeKey);
      setMsg(`第 ${idx}/${total} 个上传完成：${f.name}`, 'ok');
      maybeUploadThumb(d.file, f);
    } catch (e) {
      setMsg(`第 ${idx} 个合并失败：` + (e && e.message ? e.message : '网络错误'), 'err');
    }
    return;
  }
}
// 上传单个文件（R2 直传或本地二选一），带进度条、网速和剩余时间。
function uploadOne(job, idx, total) {
  const f = job.file;
  // 文件夹上传时每个文件有自己的目标文件夹（job.folderId）；普通上传没有，走当前目录。
  const targetFolderId = job.folderId !== undefined ? job.folderId : currentFolderId;
  const pw = authed ? '' : $('password').value.trim();
  if (!authed && !pw) { setMsg('请先填上传密码', 'err'); return Promise.resolve(); }
  if (f.size > CHUNK_UPLOAD_THRESHOLD) return uploadChunked(job, idx, total, targetFolderId, pw);
  const startedAt = Date.now();
  let lastShown = 0;
  const showProgress = (loaded, size) => {
    const pct = Math.round(loaded / size * 100);
    $('bar').style.width = pct + '%';
    const el = (Date.now() - startedAt) / 1000;
    const speed = el > 0 ? loaded / el : 0;
    const eta = speed > 0 ? Math.max(0, Math.round((size - loaded) / speed)) : 0;
    const now = Date.now();
    if (now - lastShown > 500 || loaded === size) {
      lastShown = now;
      setMsg(`正在上传 ${idx}/${total}：${f.name} · ${pct}% · ${fmtSize(speed)}/s · 还剩约 ${eta} 秒`, '');
    }
  };
  $('progress').style.display = 'block';
  if (uploadToR2()) {
    return (async () => {
      try {
        setMsg(`正在获取上传链接 ${idx}/${total}…`, '');
        const r = await fetch('/api/upload-url', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: f.name, size: f.size, visibility: job.visibility, expires: job.expires, password: pw || undefined }),
        });
        const d = await r.json();
        if (!d.ok) { setMsg(`第 ${idx} 个上传失败：` + (d.error || ('HTTP ' + r.status)), 'err'); return; }
        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('PUT', d.uploadUrl);
          xhr.upload.onprogress = (e) => { if (e.lengthComputable) showProgress(e.loaded, e.total); };
          xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error('HTTP ' + xhr.status));
          xhr.onerror = () => reject(new Error('网络错误'));
          xhr.send(f);
        });
        const r2 = await fetch('/api/upload-complete', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: d.id, key: d.key, name: f.name, size: f.size, visibility: job.visibility, expires: job.expires, folderId: targetFolderId, password: pw || undefined }),
        });
        const d2 = await r2.json();
        if (!d2.ok) setMsg(`第 ${idx} 个登记失败：` + (d2.error || ('HTTP ' + r2.status)), 'err');
        else { setMsg(`第 ${idx}/${total} 个上传完成：${f.name}`, 'ok'); maybeUploadThumb(d2.file, f); }
      } catch (e) {
        setMsg(`第 ${idx} 个上传失败：` + (e && e.message ? e.message : '网络错误'), 'err');
      }
    })();
  }
  return new Promise((resolve) => {
    const fd = new FormData();
    if (pw) fd.append('password', pw);
    fd.append('visibility', job.visibility);
    fd.append('expires', String(job.expires));
    fd.append('folderId', targetFolderId || '');
    fd.append('file', f);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) showProgress(e.loaded, e.total); };
    xhr.onload = () => {
      let d = {};
      try { d = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status === 200 && d.ok) { setMsg(`第 ${idx}/${total} 个上传完成：${f.name}`, 'ok'); maybeUploadThumb(d.file, f); }
      else setMsg(`第 ${idx} 个上传失败：` + (d.error || ('HTTP ' + xhr.status)), 'err');
      resolve();
    };
    xhr.onerror = () => { setMsg(`第 ${idx} 个上传失败：网络错误`, 'err'); resolve(); };
    xhr.send(fd);
  });
}
$('uploadBtn').onclick = () => {
  if (!selectedFiles.length) return;
  if (!enqueueFiles(selectedFiles)) return;
  selectedFiles = [];
  fi.value = '';
  $('uploadBtn').disabled = true;
  drop.innerHTML = '点击或拖拽上传<br><span style="font-size:12px">最大 5GB</span>';
};
// 全局搜索：输入后 300ms 去服务端跨所有文件夹搜文件名；只认最新一次请求的结果。
let searchResults = null; // null = 不在搜索；否则 { files, folders }
let searchSeq = 0;
let searchTimer = null;
$('search').oninput = () => {
  const q = $('search').value.trim();
  clearTimeout(searchTimer);
  if (!q) { searchResults = null; loadList(); return; }
  searchTimer = setTimeout(async () => {
    const mySeq = ++searchSeq;
    try {
      const r = await fetch('/api/search?q=' + encodeURIComponent(q));
      const d = await r.json();
      if (mySeq !== searchSeq) return;
      if (d.ok) { searchResults = { files: d.files || [], folders: d.folders || [] }; renderList(); }
    } catch {}
  }, 300);
};
function clearSearch() {
  $('search').value = '';
  searchResults = null;
  loadList();
}
document.querySelectorAll('#filters .pill[data-filter]').forEach((b) => {
  b.onclick = () => {
    typeFilter = b.dataset.filter;
    document.querySelectorAll('#filters .pill[data-filter]').forEach((x) => x.classList.toggle('active', x === b));
    renderList();
  };
});

// 分享链接访问：/s/<token>。是分享页就只展示这一个文件，否则走正常列表。
// 分享页：/s/<token>。文件分享显示单个文件；文件夹分享显示一个可浏览的文件夹（可进子文件夹）。
let shareToken = '';
let shareCode = ''; // 接收者输入的提取码（本次分享页内有效），文件链接也要带上它。
let shareFolderId = '';
let shareFiles = [];
async function loadShareView() {
  const m = location.pathname.match(/^\/s\/([A-Za-z0-9_-]+)$/);
  if (!m) return false;
  shareToken = m[1];
  $('mainWrap').style.display = 'none';
  $('shareView').style.display = 'block';
  await loadShareFolder('');
  return true;
}
async function loadShareFolder(folderId) {
  shareFolderId = folderId;
  const qs = [];
  if (folderId) qs.push('folderId=' + encodeURIComponent(folderId));
  if (shareCode) qs.push('code=' + encodeURIComponent(shareCode));
  const url = '/api/share/' + shareToken + (qs.length ? '?' + qs.join('&') : '');
  try {
    const r = await fetch(url);
    const d = await r.json();
    if (!r.ok || !d.ok) {
      if (d.needCode) {
        // 这个分享设了提取码：显示输入框，输对了再进。
        $('shareCard').innerHTML = `<div class="empty">这个分享需要提取码</div>
          <div style="display:flex;gap:8px;max-width:320px;margin:12px auto 0">
            <input type="text" id="shareCodeField" placeholder="请输入提取码" style="flex:1;padding:10px 12px;border:1px solid var(--input-border);border-radius:8px;font-size:14px;background:var(--input-bg);color:var(--text)">
            <button id="shareCodeGo">确定</button>
          </div>
          <div class="msg err" id="shareCodeMsg" style="text-align:center"></div>`;
        const go = () => {
          const v = $('shareCodeField').value.trim();
          if (!v) { $('shareCodeMsg').textContent = '请先输入提取码'; return; }
          shareCode = v;
          loadShareFolder(shareFolderId);
        };
        $('shareCodeGo').onclick = go;
        $('shareCodeField').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
        $('shareCodeField').focus();
        return;
      }
      $('shareCard').innerHTML = '<div class="empty">这个分享链接不存在或已被取消</div>';
      return;
    }
    if (d.folder) { renderShareFolder(d); return; }
    const f = d.file;
    shareFiles = [f];
    const codeQ = shareCode ? '&code=' + encodeURIComponent(shareCode) : '';
    $('shareCard').innerHTML = `
      <div class="file">
        <div class="icon">${iconFor(f)}</div>
        <div class="info">
          <div class="name">${escapeHtml(f.name)}</div>
          <div class="meta">${fmtSize(f.size)} · ${fmtDate(f.uploadedAt)}${expiryHtml(f.expiresAt)}${f.downloads ? ' · 下载 ' + f.downloads + ' 次' : ''}</div>
        </div>
        <div class="actions">
          <button onclick="confirmShareDownload('${f.id}')">下载</button>
        </div>
      </div>
      ${f.kind === 'video' ? `<video src="/f/${f.id}?share=${shareToken}${codeQ}" controls playsinline preload="metadata" style="width:100%;border-radius:8px;margin-top:12px"></video>` : ''}
      ${f.kind === 'image' ? `<img src="/f/${f.id}?share=${shareToken}${codeQ}" style="width:100%;border-radius:8px;margin-top:12px" alt="">` : ''}`;
  } catch {
    $('shareCard').innerHTML = '<div class="empty">加载失败，请稍后再试</div>';
  }
}
function renderShareFolder(d) {
  shareFiles = d.files || [];
  const crumbs = (d.path || []).map((p, i) => {
    const last = i === d.path.length - 1;
    return (i ? '<span class="sep">/</span>' : '') + (last
      ? `<span class="cur">${escapeHtml(p.name)}</span>`
      : `<button onclick="loadShareFolder('${p.id}')">${escapeHtml(p.name)}</button>`);
  }).join('');
  $('shareCard').innerHTML = `
    <div class="share-folder-head" style="font-size:16px;font-weight:600;margin-bottom:4px">${ICONS.folderSolid} ${escapeHtml(d.folder.name)}</div>
    <div class="crumbs">${crumbs}</div>
    ${(d.folders || []).map(fd => `
    <div class="file folder" onclick="loadShareFolder('${fd.id}')">
      <div class="icon">${ICONS.folderSolid}</div>
      <div class="info">
        <div class="name">${escapeHtml(fd.name)}</div>
        <div class="meta">文件夹</div>
      </div>
    </div>`).join('')}
    ${(d.files || []).map(f => `
    <div class="file" ontouchstart="cardTouchStart(event, '${f.id}', 'file')" ontouchend="cardTouchEnd()" ontouchmove="cardTouchEnd()" oncontextmenu="event.preventDefault()">
      <div class="icon">${iconFor(f)}</div>
      <div class="info">
        <div class="name">${escapeHtml(f.name)}</div>
        <div class="meta">${fmtSize(f.size)} · ${fmtDate(f.uploadedAt)}${f.downloads ? ' · 下载 ' + f.downloads + ' 次' : ''}</div>
      </div>
      <div class="actions">
        ${(f.kind === 'video' || f.kind === 'image') ? `<button class="icon-btn" title="预览" aria-label="预览" onclick="previewShare('${f.id}')">${ICONS.eye}</button>` : ''}
        <button class="icon-btn primary" title="下载" aria-label="下载" onclick="confirmShareDownload('${f.id}')">${ICONS.download}</button>
      </div>
    </div>`).join('')}
    ${!(d.folders || []).length && !(d.files || []).length ? '<div class="empty">这个文件夹是空的</div>' : ''}`;
}
function previewShare(id) {
  const f = shareFiles.find(x => x.id === id);
  if (f) preview(id, shareToken, f);
}
// 分享页下载确认（按 Jay 要求 + ZFile 居中确认弹窗）：点下载先弹确认框，确定才真的下载；原始 /f/ 链接本身保持直链（预览用）。
let downloadConfirmUrl = '';
function shareDownloadUrl(f) {
  return '/f/' + f.id + '?share=' + shareToken + (shareCode ? '&code=' + encodeURIComponent(shareCode) : '') + '&download=1';
}
function confirmShareDownload(id) {
  const f = (shareFiles || []).find(x => x.id === id);
  if (!f) return;
  downloadConfirmUrl = shareDownloadUrl(f);
  $('downloadConfirmName').textContent = f.name;
  $('downloadConfirmSize').textContent = fmtSize(f.size);
  $('downloadConfirmModal').classList.add('open');
}
function closeDownloadConfirm() { $('downloadConfirmModal').classList.remove('open'); downloadConfirmUrl = ''; }
$('downloadConfirmOk').onclick = () => { if (downloadConfirmUrl) location.href = downloadConfirmUrl; closeDownloadConfirm(); };
$('downloadConfirmCancel').onclick = closeDownloadConfirm;
$('downloadConfirmClose').onclick = closeDownloadConfirm;
$('downloadConfirmModal').onclick = (e) => { if (e.target.id === 'downloadConfirmModal') closeDownloadConfirm(); };
// 上传区折叠：手机默认收起（首屏直接看文件列表），桌面默认展开；点标题旁的按钮切换，状态记在浏览器里。
function setUploadCollapsed(collapsed) {
  const card = $('uploadCard');
  if (!card) return;
  card.classList.toggle('collapsed', collapsed);
  const btn = $('uploadCollapseBtn');
  if (btn) { btn.title = collapsed ? '展开上传区' : '收起上传区'; btn.setAttribute('aria-label', btn.title); }
  try { localStorage.setItem('fs-upload-collapsed', collapsed ? '1' : '0'); } catch {}
}
function initUploadCollapse() {
  const btn = $('uploadCollapseBtn');
  if (!btn) return;
  btn.onclick = () => setUploadCollapsed(!$('uploadCard').classList.contains('collapsed'));
  let saved = null;
  try { saved = localStorage.getItem('fs-upload-collapsed'); } catch {}
  const collapsed = saved !== null ? saved === '1' : window.innerWidth <= 600;
  setUploadCollapsed(collapsed);
}
initUploadCollapse();
renderViewToggle();
applyTheme();
loadShareView().then(async (isShare) => { if (!isShare) { await refreshAuth(); loadList(); loadAnnouncement(); } });
</script>
